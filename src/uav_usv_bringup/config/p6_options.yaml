# Optional P6 reference options. Ordinary launch does not load this file.
# Online prediction is IMM only; launch routes it to the primary prediction topic.
# risk_horizon_seconds: 0.45 checks the actual execution lease; 0 checks the full curve.
# Robust results use empirical envelopes, never a whole-task 95% probability claim.
p4_follow_planner_node:
  ros__parameters:
    p6_visibility_mode: nominal
    p6_adaptive_viewpoint: false
    p6_allow_nominal_fallback: true
    p6_risk_budget: 0.05
    p6_risk_horizon_seconds: 0.45
    p6_calibration_file: ''
    p6_yaw_error_bound_rad: 0.06
    p6_attitude_error_bound_rad: 0.03
    p6_extrinsic_rotation_bound_rad: 0.0
    p6_extrinsic_translation_bound_m: 0.0
    p6_minimum_distance: 4.5
    p6_maximum_distance: 6.0
    p6_maximum_beta: 0.3490658503988659
    p6_maximum_distance_rate: 0.15
    p6_maximum_beta_rate: 0.05
