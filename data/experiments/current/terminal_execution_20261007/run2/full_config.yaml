target_bearing_node:
  ros__parameters:
    camera_pitch_down: 0.4886921905584123
    color_topic: /camera/front/image_raw
    bearing_topic: /perception/front/target_bearing
    horizontal_fov: 1.74
    minimum_red_pixels: 3
    gazebo_world_name: default
